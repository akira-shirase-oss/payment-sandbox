[workspace]
members = ["crates/*", "fixtures/dev-store"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/akira-shirase-oss/payment-sandbox"
# SIMULATED MONEY ONLY. Nothing is published to crates.io.
publish = false

[workspace.dependencies]
sandbox-domain = { path = "crates/sandbox-domain" }
sandbox-db = { path = "crates/sandbox-db" }
sandbox-sim = { path = "crates/sandbox-sim" }
sandbox-dev-store = { path = "fixtures/dev-store" }
sandbox-http = { path = "crates/sandbox-http" }

# External crates: versions live here only. Minimal features; one async runtime (Tokio);
# no TLS stack (everything this sandbox talks to is on loopback, D-023).
anyhow = "1.0.104"
# Key and secret generation (OS randomness).
getrandom = "0.3.4"
axum = "0.8.9"
hex = "0.4.3"
hmac = "0.13"
# Webhook signing secrets are encrypted at rest (D-020).
chacha20poly1305 = "0.10.1"
proptest = "1.12.0"
# The simulated network's own store (D-034): pure-Rust, ACID, crash-safe, no C library.
redb = "4.5.0"
# HTTP client to the simulated network: plain HTTP on loopback, no TLS, no proxies.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time"] }
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["std", "formatting", "serde"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["request-id", "trace", "timeout", "limit", "catch-panic", "set-header", "sensitive-headers"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29", features = ["v5", "v7", "serde"] }
http-body-util = "0.1.5"
# Bounded serving (sandbox-http): the HTTP/1 connection builder with a timer, so header-read
# timeouts work; both already in the tree through axum and reqwest.
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "deny"

[profile.release]
debug = "line-tables-only"
