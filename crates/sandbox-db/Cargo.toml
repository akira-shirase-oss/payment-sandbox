[package]
name = "sandbox-db"
description = "PostgreSQL storage for the Payment Sandbox (SIMULATED MONEY ONLY): migrations, the append-only journal, capacity transactions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# TestDb: one throwaway database per test, created from PS_TEST_DATABASE_URL.
test-support = ["dep:tokio"]

[dependencies]
sandbox-domain.workspace = true
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
sandbox-db = { path = ".", features = ["test-support"] }
tokio.workspace = true

[lints]
workspace = true
