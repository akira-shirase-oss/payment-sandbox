[package]
name = "sandbox-server"
description = "The Payment Sandbox API server (SIMULATED MONEY ONLY): payments, holds, captures, refunds, webhooks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Crash points for the recovery drills (tests/drills.rs). Never in a release build.
fault-injection = []

[[bin]]
name = "sandbox-server"
path = "src/main.rs"

# The process-kill drills need the crash points compiled into the binary they spawn.
[[test]]
name = "drills"
required-features = ["fault-injection"]

[dependencies]
sandbox-http.workspace = true
anyhow.workspace = true
axum.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
reqwest.workspace = true
sandbox-db.workspace = true
sandbox-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util.workspace = true
proptest.workspace = true
sandbox-dev-store.workspace = true
sandbox-sim.workspace = true
sandbox-db = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
