[package]
name = "sandbox-sim"
description = "The Payment Sandbox's simulated card network (SIMULATED MONEY ONLY): a separate process with its own redb store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Crash points for the durability drill (tests/drills.rs). Never in a release build.
fault-injection = []

[[bin]]
name = "sandbox-sim"
path = "src/main.rs"

# The commit-crash drill needs the crash point compiled into the binary it spawns.
[[test]]
name = "drills"
required-features = ["fault-injection"]

[dependencies]
sandbox-http.workspace = true
anyhow.workspace = true
axum.workspace = true
hex.workspace = true
sandbox-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Its own store (D-018, D-034): one redb file nothing else opens.
redb.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
reqwest.workspace = true

[lints]
workspace = true
