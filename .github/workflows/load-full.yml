name: load-full

# The full (≥1,000,000-request) load runs, on GitHub-hosted runners: the maintainer's laptop
# is shared with other work, so its load must not decide the result (D-085). Manual only.
# One job per scenario, each on its own runner with its own PostgreSQL (deploy/compose.yaml,
# the local stack's image, digest and settings), the release build, and
# `MODE=full scripts/load.sh <scenario>`. Each result JSON is labelled as a GitHub-hosted
# runner observation (the machine's CPU, cores, memory and OS; no host names) and uploaded
# as an artifact, pass or miss; the results are committed under perf/results/ by hand.
# SIMULATED MONEY ONLY: the traffic never leaves the runner.
#
#   gh workflow run load-full.yml -f scenario=all
#   gh workflow run load-full.yml -f scenario=m1-auth,m3-uncertain

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "all, or scenarios separated by commas (m0-probes, m1-auth, m2-lifecycle, m2-refund-race, m3-uncertain, m4-webhooks, m5-explain, m6-checkout, m7-developer, m8-overload, probe-read-edge); capacity mode needs exactly one"
        type: string
        default: all
      mode:
        description: "full: the scenario at its own shape (RATE/SECONDS override); capacity: step the rate until the thresholds fail and record the knee (D-102)"
        type: choice
        options: [full, capacity]
        default: full
      rate:
        description: "full mode: RATE env the scenario reads (empty = the scenario default)"
        type: string
        default: ""
      seconds:
        description: "full mode: SECONDS env (empty = the scenario default); capacity mode: seconds per step"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: load-full-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scenarios: ${{ steps.pick.outputs.scenarios }}
    steps:
      - id: pick
        env:
          CHOSEN: ${{ inputs.scenario }}
          MODE: ${{ inputs.mode }}
        run: |
          all='["m0-probes","m1-auth","m2-lifecycle","m2-refund-race","m3-uncertain","m4-webhooks","m5-explain","m6-checkout","m7-developer","m8-overload","probe-read-edge"]'
          if [ "$MODE" = capacity ]; then
            # The probe measures one scenario's knee per run.
            picked="$(jq -cn --arg chosen "$CHOSEN" --argjson all "$all" \
              '[$chosen | split(",")[] | gsub("^ +| +$"; "")] | unique as $c
               | if $c == ["all"] then error("capacity needs one scenario, not all")
                   elif ($c - $all) == [] and ($c | length) == 1 then $c
                   else error("capacity needs exactly one known scenario, got \($chosen)") end')"
            echo "scenarios=$picked" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CHOSEN" = all ]; then
            echo "scenarios=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only names from the list above, so nothing else reaches a job's name or a path.
          picked="$(jq -cn --arg chosen "$CHOSEN" --argjson all "$all" \
            '[$chosen | split(",")[] | gsub("^ +| +$"; "")] | unique as $c
             | if ($c - $all) == [] and ($c | length) > 0 then $c else error("unknown scenario in \($chosen)") end')"
          echo "scenarios=$picked" >> "$GITHUB_OUTPUT"

  load:
    name: load ${{ matrix.scenario }} (full)
    needs: plan
    runs-on: ubuntu-latest
    # The longest scenario offers load for 3,400 s; the build and its checks come on top.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    env:
      SCENARIO: ${{ matrix.scenario }}
    steps:
      # Third-party actions are pinned to commit SHAs, as in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: k6 (pinned, checksummed)
        run: scripts/install-k6.sh "$RUNNER_TEMP/bin"
      - name: PostgreSQL, as the local stack runs it (lock waits logged)
        run: docker compose -f deploy/compose.yaml up -d --wait postgres
      - name: The full run
        id: run
        env:
          RUN_MODE: ${{ inputs.mode }}
          RATE: ${{ inputs.rate }}
          SECONDS: ${{ inputs.seconds }}
        run: |
          eval "$(scripts/stack.sh env)"
          set +e
          if [ "$RUN_MODE" = capacity ]; then
            # Capacity mode steps the rate through short MODE=full runs until the run's own
            # thresholds fail; the record carries the knee and the recommended full rate.
            PATH="$RUNNER_TEMP/bin:$PATH" scripts/load-capacity.sh "$SCENARIO" "${RATE:-100}" "${SECONDS:-45}"
            k6_status=$?
            # The knee record is not a threshold gate; a probe that ran is a success.
            [ $k6_status -eq 0 ] || k6_status=0
          else
            PATH="$RUNNER_TEMP/bin:$PATH" MODE=full scripts/load.sh "$SCENARIO"
            k6_status=$?
          fi
          echo "k6_status=$k6_status" >> "$GITHUB_OUTPUT"
      - name: Label the result as a GitHub-hosted runner observation
        id: label
        if: always()
        env:
          RUN_MODE: ${{ inputs.mode }}
        run: |
          # This run's result is the one file git does not know (earlier results are committed).
          # The pattern is a regex, not a glob: capacity yields the step -full.json files
          # plus the -capacity.json knee record (run 44747097733: a glob-shaped '*' matched
          # nothing and the labelling failed on "expected new result(s), found 0").
          pat="-${SCENARIO}-full\\.json$"; [ "$RUN_MODE" = capacity ] && pat="-${SCENARIO}-.*\\.json$"
          mapfile -t results < <(git status --porcelain --untracked-files=all -- perf/results \
            | awk '/^\?\? / {print $2}' | grep -E "$pat" || true)
          [ "${#results[@]}" -ge 1 ] || { echo "expected new result(s), found ${#results[@]}" >&2; exit 1; }
          # Capacity runs yield the step files plus the knee record; every one is labelled.
          printf '%s\n' "${results[@]}" > /tmp/this-run-files
          echo "result<<EOF" >> "$GITHUB_OUTPUT"; cat /tmp/this-run-files >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          for f in "${results[@]}"; do
            labelled="$(jq \
              --arg image "${ImageOS:-unknown}/${ImageVersion:-unknown}" \
              --arg arch "$RUNNER_ARCH" \
              --arg workflow_run "$GITHUB_RUN_ID" \
              '.machine.label = "GitHub-hosted runner" |
               .machine.runner = {image: $image, arch: $arch, workflow_run: ($workflow_run | tonumber)} |
               .machine.note = "GitHub-hosted runner: the load generator, the server, the network and PostgreSQL share one runner VM on shared cloud hardware; an observation, not capacity"' \
              "$f")"
            printf '%s\n' "$labelled" > "$f"
          done
          for f in "${results[@]}"; do
            jq '{scenario, mode, thresholds_passed, requests, requests_per_second, failed_rate, dropped_iterations, latency_ms, knee_requests_per_second, recommended_full_rate, machine: {label: .machine.label, cpu: .machine.cpu, cores: .machine.cores, memory_gb: .machine.memory_gb}}' "$f" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-${{ matrix.scenario }}
          path: |
            ${{ steps.label.outputs.result }}
          if-no-files-found: error
          retention-days: 30
      - name: A threshold miss fails the job (the result is kept either way)
        if: steps.run.outputs.k6_status != '0'
        env:
          K6_STATUS: ${{ steps.run.outputs.k6_status }}
        run: |
          echo "k6 exited $K6_STATUS: a threshold miss, kept as evidence" >&2
          exit 1
