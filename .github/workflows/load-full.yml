name: load-full

# The full (≥1,000,000-request) load runs, on GitHub-hosted runners: the maintainer's laptop
# is shared with other work, so its load must not decide the result (D-085). Manual only.
# One job per scenario, each on its own runner with its own PostgreSQL (deploy/compose.yaml,
# the local stack's image, digest and settings), the release build, and
# `MODE=full scripts/load.sh <scenario>`. Each result JSON is labelled as a GitHub-hosted
# runner observation (the machine's CPU, cores, memory and OS; no host names) and uploaded
# as an artifact, pass or miss; the results are committed under perf/results/ by hand.
# SIMULATED MONEY ONLY: the traffic never leaves the runner.
#
#   gh workflow run load-full.yml -f scenario=all
#   gh workflow run load-full.yml -f scenario=m1-auth,m3-uncertain

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "all, or scenarios separated by commas (m0-probes, m1-auth, m2-lifecycle, m2-refund-race, m3-uncertain, m4-webhooks, m5-explain, m6-checkout, m7-developer)"
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: load-full-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scenarios: ${{ steps.pick.outputs.scenarios }}
    steps:
      - id: pick
        env:
          CHOSEN: ${{ inputs.scenario }}
        run: |
          all='["m0-probes","m1-auth","m2-lifecycle","m2-refund-race","m3-uncertain","m4-webhooks","m5-explain","m6-checkout","m7-developer"]'
          if [ "$CHOSEN" = all ]; then
            echo "scenarios=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only names from the list above, so nothing else reaches a job's name or a path.
          picked="$(jq -cn --arg chosen "$CHOSEN" --argjson all "$all" \
            '[$chosen | split(",")[] | gsub("^ +| +$"; "")] | unique as $c
             | if ($c - $all) == [] and ($c | length) > 0 then $c else error("unknown scenario in \($chosen)") end')"
          echo "scenarios=$picked" >> "$GITHUB_OUTPUT"

  load:
    name: load ${{ matrix.scenario }} (full)
    needs: plan
    runs-on: ubuntu-latest
    # The longest scenario offers load for 3,400 s; the build and its checks come on top.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    env:
      SCENARIO: ${{ matrix.scenario }}
    steps:
      # Third-party actions are pinned to commit SHAs, as in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: k6 (pinned, checksummed)
        run: scripts/install-k6.sh "$RUNNER_TEMP/bin"
      - name: PostgreSQL, as the local stack runs it (lock waits logged)
        run: docker compose -f deploy/compose.yaml up -d --wait postgres
      - name: The full run
        id: run
        run: |
          eval "$(scripts/stack.sh env)"
          set +e
          PATH="$RUNNER_TEMP/bin:$PATH" MODE=full scripts/load.sh "$SCENARIO"
          echo "k6_status=$?" >> "$GITHUB_OUTPUT"
      - name: Label the result as a GitHub-hosted runner observation
        if: always()
        run: |
          shopt -s nullglob
          results=(perf/results/*-"$SCENARIO"-full.json)
          [ "${#results[@]}" -eq 1 ] || { echo "expected one result, found ${#results[@]}" >&2; exit 1; }
          labelled="$(jq \
            --arg image "${ImageOS:-unknown}/${ImageVersion:-unknown}" \
            --arg arch "$RUNNER_ARCH" \
            --arg workflow_run "$GITHUB_RUN_ID" \
            '.machine.label = "GitHub-hosted runner" |
             .machine.runner = {image: $image, arch: $arch, workflow_run: ($workflow_run | tonumber)} |
             .machine.note = "GitHub-hosted runner: the load generator, the server, the network and PostgreSQL share one runner VM on shared cloud hardware; an observation, not capacity"' \
            "${results[0]}")"
          printf '%s\n' "$labelled" > "${results[0]}"
          jq '{scenario, thresholds_passed, requests, requests_per_second, failed_rate, dropped_iterations, latency_ms, machine: {label: .machine.label, cpu: .machine.cpu, cores: .machine.cores, memory_gb: .machine.memory_gb}}' "${results[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-${{ matrix.scenario }}
          path: perf/results/*-${{ matrix.scenario }}-full.json
          if-no-files-found: error
          retention-days: 30
      - name: A threshold miss fails the job (the result is kept either way)
        if: steps.run.outputs.k6_status != '0'
        env:
          K6_STATUS: ${{ steps.run.outputs.k6_status }}
        run: |
          echo "k6 exited $K6_STATUS: a threshold miss, kept as evidence" >&2
          exit 1
