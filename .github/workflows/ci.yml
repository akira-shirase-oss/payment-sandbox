name: ci

on:
  push:
  pull_request:
  schedule:
    # Daily: new advisories appear without any code change.
    - cron: "41 5 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (toolchain, fmt, clippy, architecture, tests against PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Same image and digest as deploy/compose.yaml.
        image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox-dev
          POSTGRES_DB: sandbox
        ports:
          - 56432:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=sandbox --dbname=sandbox"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # The second, empty cluster for the cross-cluster restore rehearsal (D-055).
      postgres_restore:
        # Same image and digest as deploy/compose.yaml.
        image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox-dev
          POSTGRES_DB: sandbox
        ports:
          - 56450:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=sandbox --dbname=sandbox"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PS_TEST_DATABASE_URL: postgres://sandbox:sandbox-dev@127.0.0.1:56432/sandbox
      PS_TEST_RESTORE_DATABASE_URL: postgres://sandbox:sandbox-dev@127.0.0.1:56450/sandbox
    steps:
      # Third-party actions are pinned to commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/check-toolchain.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy on the fault-injection build (crash points for the drills)
        run: cargo clippy -p sandbox-server -p sandbox-sim --features fault-injection --all-targets --locked -- -D warnings
      - run: scripts/check-architecture.sh
      - name: The architecture check can fail
        run: "! ARCH_BANNED=sha2 scripts/check-architecture.sh"
      - run: cargo test --workspace --locked
        env:
          # The restore rehearsal (scripts/restore-rehearsal.sh) runs pg_dump and pg_restore
          # inside the PostgreSQL container, so their version matches the server's.
          PS_PG_CONTAINER: ${{ job.services.postgres.id }}
          PS_PG_RESTORE_CONTAINER: ${{ job.services.postgres_restore.id }}
      - name: Attack regression suite (auth bypass, cross-tenant, SSRF, replay, oversized/slow bodies)
        run: cargo test -p sandbox-server --test attacks --locked
      - name: Mutation proof (each attack fails without the protection it asserts)
        run: scripts/mutation-proof.sh
      - name: Parser fuzz smoke (seed corpus + proptest; a panic is a bug)
        env:
          PROPTEST_CASES: "512"
        run: cargo test -p sandbox-domain --test fuzz --locked && cargo test -p sandbox-server --test fuzz --locked
      - name: Recovery drills (the real server binary killed at fault points)
        run: cargo test -p sandbox-server --features fault-injection --test drills --locked
      - name: The network's commit-crash drill (no acknowledged command is lost)
        run: cargo test -p sandbox-sim --features fault-injection --test drills --locked
      - name: Load smoke (short runs; full runs are local, committed under perf/results/)
        env:
          PS_ADMIN_DATABASE_URL: postgres://sandbox:sandbox-dev@127.0.0.1:56432/sandbox
          PS_MIGRATE_DATABASE_URL: postgres://ps_owner:ps-owner-dev@127.0.0.1:56432/payment_sandbox
          PS_DATABASE_URL: postgres://ps_app:ps-app-dev@127.0.0.1:56432/payment_sandbox
        run: |
          scripts/install-k6.sh "$RUNNER_TEMP/bin"
          PATH="$RUNNER_TEMP/bin:$PATH" MODE=smoke scripts/load.sh m0-probes

  # The checkout, the dashboard and the SDK (M6, M7): type checks, component and unit tests,
  # the browser journeys in Chromium against the real server, network and store, the
  # developer examples and the SDK's live tests (scripts/e2e.sh), the size budgets (D-064).
  web:
    name: web (checks, components, Chromium journeys, size budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Same image and digest as deploy/compose.yaml.
        image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox-dev
          POSTGRES_DB: sandbox
        ports:
          - 56432:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=sandbox --dbname=sandbox"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PS_ADMIN_DATABASE_URL: postgres://sandbox:sandbox-dev@127.0.0.1:56432/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check --workspaces --if-present
      - run: npm test --workspaces --if-present
      - run: npx -w @sandbox/e2e playwright install --with-deps chromium
      - name: Browser journeys (the real server, network and store)
        env:
          PS_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: scripts/e2e.sh
      - run: node --test "perf/scenarios/"*.test.mjs
      - run: node scripts/web-budget.mjs
      - run: node scripts/check-doc-examples.mjs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: e2e/test-results
          retention-days: 7

  # The production path (D-071; docs/OPERATING.md): release builds installed from the env
  # templates and run in the shared profile behind public origins and Caddy over https
  # (scripts/release-smoke.sh), then the same install under systemd, from the units in
  # deploy/systemd, against the runner's own PostgreSQL 18 from Ubuntu packages (D-082).
  release:
    name: release (release build, env files, systemd units)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        # Same image and digest as deploy/compose.yaml.
        image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox-dev
          POSTGRES_DB: sandbox
        ports:
          - 56432:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=sandbox --dbname=sandbox"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PS_ADMIN_DATABASE_URL: postgres://sandbox:sandbox-dev@127.0.0.1:56432/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Release smoke (release binaries from the env templates, shared profile)
        env:
          PS_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: scripts/release-smoke.sh
      - name: PostgreSQL 18 as Ubuntu's packages install it (peer on the socket, scram on TCP)
        run: echo "PS_HOST_PG_PORT=$(sudo scripts/ci-postgresql.sh)" >> "$GITHUB_ENV"
      - name: The systemd units, installed and started against it, backed up and restored
        run: sudo --preserve-env=PS_HOST_PG_PORT scripts/release-systemd.sh

  supply-chain:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
